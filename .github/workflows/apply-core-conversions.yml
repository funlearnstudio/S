name: Apply core conversions

on:
  push:
    branches:
      - feature-core-conversions-v2
    paths:
      - tools/apply_core_conversions.py
      - .github/workflows/apply-core-conversions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-core-conversions-v2
      - name: Apply conversion implementation
        run: python3 tools/apply_core_conversions.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/interpreter/interpreter.cpp src/type/checker.cpp tests/tests.cpp
          git diff --cached --quiet && exit 0
          git commit -m "feat: add core type conversion aliases"
          git push origin HEAD:feature-core-conversions-v2
