name: SE CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: CLI smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/se --version
          ./build/se check examples/hello.se
          ./build/se run examples/hello.se
          ./build/se build examples/hello.se
          ./examples/hello
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\Release\se.exe --version
          .\build\Release\se.exe check examples\hello.se
          .\build\Release\se.exe run examples\hello.se
