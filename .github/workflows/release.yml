name: SE Release Binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: se-linux-x86_64
          - os: macos-13
            asset: se-macos-x86_64
          - os: macos-14
            asset: se-macos-arm64
          - os: windows-latest
            asset: se-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --config Release --parallel
      - name: Install staging tree
        run: cmake --install build --config Release --prefix package
      - name: Archive Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "${{ matrix.asset }}.tar.gz" .
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: ignore
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @vscode/vsce
      - run: cd vscode && vsce package -o ../se-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: se-vscode
          path: se-vscode.vsix
  release:
    needs: [binaries, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
