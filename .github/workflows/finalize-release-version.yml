name: Finalize SE release version

on:
  push:
    branches:
      - release-0.6-prebuilt
    paths:
      - tools/finalize_release_version.py
      - .github/workflows/finalize-release-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.6-prebuilt
      - run: python3 tools/finalize_release_version.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git diff --cached --quiet && exit 0
          git commit -m "release: finalize SE 0.6.0 version"
          git push origin HEAD:release-0.6-prebuilt
